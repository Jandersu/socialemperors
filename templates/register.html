{% extends 'base.html' %}
{% block title %}Criar conta · Social Empires{% endblock %}
{% block content %}
<section class="auth-panel" aria-labelledby="register-title">
    <div class="auth-heading">
        <img class="heading-character" src="{{ url_for('images', path='knight.png') }}" alt="" width="56" height="52">
        <div><h1 id="register-title">Crie sua conta</h1><p>O primeiro passo para construir seu império.</p></div>
    </div>
    {% if error %}<div id="form-error" class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
    <form action="{{ url_for('register') }}" method="post" class="account-form" {% if error %}aria-describedby="form-error"{% endif %}>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-field">
            <label for="name">Nome do jogador</label>
            <input id="name" name="name" type="text" autocomplete="nickname" minlength="2" maxlength="60" value="{{ (values | default({})).get('name', '') }}" required autofocus>
        </div>
        <div class="form-field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" value="{{ (values | default({})).get('email', '') }}" required>
        </div>
        <div class="form-field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="password-hint" required>
            <span id="password-hint" class="field-hint">Use pelo menos 10 caracteres.</span>
        </div>
        <div class="form-field">
            <label for="password-confirm">Confirme sua senha</label>
            <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        </div>
        <button class="button button-primary button-wide" type="submit">Solicitar cadastro</button>
    </form>
    <div class="auth-switch">Já tem uma conta? <a href="{{ url_for('login') }}">Entrar na minha vila</a></div>
</section>
{% endblock %}
