{% extends 'base.html' %}
{% block title %}Entrar · Social Empires{% endblock %}
{% block content %}
<section class="auth-panel" aria-labelledby="login-title">
    <div class="auth-heading">
        <img class="heading-character" src="{{ url_for('images', path='villager.png') }}" alt="" width="56" height="56">
        <div><h1 id="login-title">Entre na sua vila</h1><p>Seu império está esperando por você.</p></div>
    </div>
    {% if error %}<div id="form-error" class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
    <form action="{{ url_for('login') }}" method="post" class="account-form" {% if error %}aria-describedby="form-error"{% endif %}>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" value="{{ (values | default({})).get('email', '') }}" required autofocus>
        </div>
        <div class="form-field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        </div>
        <button class="button button-primary button-wide" type="submit">Entrar na minha vila</button>
    </form>
    <div class="auth-switch">Ainda não tem uma conta? <a href="{{ url_for('register') }}">Criar conta</a></div>
</section>
{% endblock %}
